[project]
name = "experimentlab-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["experimentlab-api", "experimentlab-statistics"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "packages/statistics"]

[tool.uv.sources]
experimentlab-api = { workspace = true }
experimentlab-statistics = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["backend/tests", "packages/statistics/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".tools", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["experimentlab", "experimentlab_statistics"]
