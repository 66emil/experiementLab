[project]
name = "experimentlab-statistics"
version = "0.2.0"
description = "Pure statistical functions, independent from HTTP and persistence."
requires-python = ">=3.12"
dependencies = ["scipy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experimentlab_statistics"]
